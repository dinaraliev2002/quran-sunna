name: Android APK (тестовая сборка)
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Сборка сайта для магазинов и синхронизация
        working-directory: app
        run: |
          npm ci
          npm run sync:store
      - name: Сборка APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: quran-sunna-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
